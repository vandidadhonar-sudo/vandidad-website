# Turns committed Markdown into published pages.
#
# On main this renders and commits the HTML back, which is what puts an article
# on the site — the Worker reads content/ from the repository, so the commit is
# the deployment. On a branch or a pull request it only validates, so a writer
# finds out that an article is 400 words or missing its Iranian-business
# section before it is merged, not after it is live.
#
# The generated HTML is committed rather than rendered at request time so that
# what is serving can be read and diffed like anything else in the repo, and so
# a failure in the renderer can never take the site's articles down.

name: Publish content

on:
  push:
    branches: [main]
    paths:
      - content/**/*.md
      - tools/*.py
      - .github/workflows/publish-content.yml
  pull_request:
    paths:
      - content/**/*.md
      - tools/*.py
  workflow_dispatch: {}

concurrency:
  group: publish-content
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the renderer's dependencies
        run: pip install --quiet "markdown==3.7" "PyYAML==6.0.2"

      # The pipeline's own tests, before anything is rendered or pushed. Most
      # of what they cover runs unattended at 09:00 with nobody watching, so a
      # break shows up as an article that quietly never published — the kind
      # of failure that is noticed a week late.
      - name: Test the pipeline
        run: python3 tools/test_pipeline.py

      # On a pull request nothing is written: the job exists to tell the writer
      # what is wrong while it is still cheap to fix.
      - name: Check the articles
        if: github.event_name == 'pull_request'
        run: python3 tools/build_content.py --check

      # On-page SEO, measured rather than remembered: is each article's target
      # phrase actually used, is it in the places a searcher sees, does the
      # page link anywhere, and does anything link back to it. On a pull
      # request this fails the job, because the cheapest moment to fix a page
      # that targets nothing is before it exists.
      - name: Check the keywords and the internal links
        if: github.event_name == 'pull_request'
        run: python3 tools/seo_report.py --check

      - name: Render the articles
        if: github.event_name != 'pull_request'
        run: python3 tools/build_content.py

      # Regenerates docs/keywords.md from the articles as they now stand. It
      # does not fail the run here: by this point the article is rendered, and
      # a report that blocks publishing would be a report nobody keeps.
      # The identity goal, measured. The on-page half is entirely under our
      # control, so a failure there is a real defect and this step says so —
      # but it does not block a publish, because an article that is ready
      # should not wait on a name spelling.
      - name: Audit the identity
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: python3 tools/identity_audit.py

      - name: Rebuild the keyword list
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: python3 tools/seo_report.py

      - name: Publish
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          # Everything tools/build_content.py writes, not only the articles.
          # This used to stage content/, sitemap.xml and the keyword report,
          # so about.html, llms.txt and the founder page regenerated on the
          # runner every morning and were then thrown away — the live pages
          # kept an article count and an article list frozen at whatever they
          # were when a human last ran the renderer by hand.
          GENERATED="content sitemap.xml feed.xml llms.txt about.html \
            hadi-bakhtzadeh.html docs/keywords.md"
          if [ -z "$(git status --porcelain -- $GENERATED)" ]; then
            echo "هیچ صفحه‌ای تغییر نکرد."
            exit 0
          fi
          git config user.name "vandidad-content-bot"
          git config user.email "ai@vandidad.xyz"
          git add -- $GENERATED
          git commit -m "content: publish rendered articles

          Generated by tools/build_content.py from the committed Markdown.
          Do not edit these files by hand — the next render overwrites them."
          # Only .md, the renderer and this workflow trigger this job, so a
          # commit of .html cannot start it again.
          git push

      # Tells Bing and its partners the moment a page exists, instead of
      # waiting weeks for a crawler. This was a heredoc inside a heredoc inside
      # YAML, which could not be run or tested anywhere but on main; it is now
      # tools/indexnow.py, which explains itself and has tests. It never fails
      # the build — the article is already live by this point.
      - name: Tell the search engines
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: python3 tools/indexnow.py
