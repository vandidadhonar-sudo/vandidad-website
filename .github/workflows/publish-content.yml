# Turns committed Markdown into published pages.
#
# On main this renders and commits the HTML back, which is what puts an article
# on the site — the Worker reads content/ from the repository, so the commit is
# the deployment. On a branch or a pull request it only validates, so a writer
# finds out that an article is 400 words or missing its Iranian-business
# section before it is merged, not after it is live.
#
# The generated HTML is committed rather than rendered at request time so that
# what is serving can be read and diffed like anything else in the repo, and so
# a failure in the renderer can never take the site's articles down.

name: Publish content

on:
  push:
    branches: [main]
    paths:
      - content/**/*.md
      - tools/build_content.py
      - .github/workflows/publish-content.yml
  pull_request:
    paths:
      - content/**/*.md
      - tools/build_content.py
  workflow_dispatch: {}

concurrency:
  group: publish-content
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the renderer's dependencies
        run: pip install --quiet "markdown==3.7" "PyYAML==6.0.2"

      # On a pull request nothing is written: the job exists to tell the writer
      # what is wrong while it is still cheap to fix.
      - name: Check the articles
        if: github.event_name == 'pull_request'
        run: python3 tools/build_content.py --check

      - name: Render the articles
        if: github.event_name != 'pull_request'
        run: python3 tools/build_content.py

      - name: Publish
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain content sitemap.xml)" ]; then
            echo "هیچ صفحه‌ای تغییر نکرد."
            exit 0
          fi
          git config user.name "vandidad-content-bot"
          git config user.email "ai@vandidad.xyz"
          git add content sitemap.xml
          git commit -m "content: publish rendered articles

          Generated by tools/build_content.py from the committed Markdown.
          Do not edit these files by hand — the next render overwrites them."
          # Only .md, the renderer and this workflow trigger this job, so a
          # commit of .html cannot start it again.
          git push

      # Waiting for a crawler to notice a new article takes weeks. IndexNow
      # tells the engines the moment it exists, and it is free and needs no
      # account — the key file served at the domain root is the whole
      # authentication. Bing is the one that matters most here: ChatGPT's live
      # search reads Bing, so this is the shortest path from publishing an
      # article to an assistant being able to cite it.
      #
      # Google does not participate in IndexNow and is reached through the
      # sitemap instead. A failure here must never fail the build: the article
      # is already published, and a search engine being slow is not a reason to
      # mark the run red.
      - name: Tell the search engines
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          set -uo pipefail
          KEY=e1f25c1e9599de7ac40a9f13dd647f7c7fa1f352213a90ca3c667c623d1f933e
          URLS=$(python3 - <<'PY'
          import re, pathlib, json
          xml = pathlib.Path("sitemap.xml").read_text(encoding="utf-8")
          print(json.dumps(re.findall(r"<loc>(.*?)</loc>", xml)))
          PY
          )
          echo "اعلام به موتورها: $(echo "$URLS" | python3 -c 'import sys,json;print(len(json.load(sys.stdin)))') آدرس"
          BODY=$(python3 - <<PY
          import json
          print(json.dumps({
            "host": "vandidad.xyz",
            "key": "$KEY",
            "keyLocation": "https://vandidad.xyz/$KEY.txt",
            "urlList": json.loads('''$URLS'''),
          }))
          PY
          )
          code=$(curl -sS -o /tmp/indexnow.out -w '%{http_code}' \
            -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data "$BODY" --max-time 30 || echo 000)
          echo "پاسخ IndexNow: $code"
          cat /tmp/indexnow.out || true
