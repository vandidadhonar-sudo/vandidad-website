# Publishes the Cloudflare Worker whenever its code or configuration changes on
# main. The owner does not write code, so the deployment must not depend on
# anyone remembering to copy a file into a dashboard — that manual step is what
# took the legal pages offline once already.
#
# Only the Worker's own files trigger this. index.html and the static pages are
# read from the repository by the Worker at request time, so they are already
# live the moment they land on main and must not cause a redeploy.

name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - cloudflare-worker.js
      - wrangler.toml
      - .github/workflows/deploy-worker.yml
      - hero.mp4
      - hero-poster.jpg
      # A new font file has to reach the bucket, and only this workflow puts
      # anything there.
      - fonts/**
  workflow_dispatch: {}

# A second deploy starting while the first is mid-flight could publish the older
# of the two last. Queue them instead, and never cancel one in progress.
concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # A syntax error would otherwise be discovered by visitors rather than by
      # this job: Wrangler is what actually bundles the Worker, so ask it to do
      # the whole build and stop short of uploading.
      #
      # The version is pinned rather than floating on @4. A deploy that only
      # happens when the Worker changes is rare enough that a surprise from a
      # fresh Wrangler release would land on a day nobody is watching, and this
      # exact version is the one the bundle was tested against.
      - name: Check the Worker builds
        run: npx --yes wrangler@4.110.0 deploy --dry-run --outdir /tmp/build

      # A dry run proves the file parses, and nothing more — a route that
      # returns the wrong thing parses perfectly. The Worker is the whole
      # site, so a mistake in it does not degrade a page, it takes the domain
      # down. These exercise the routing against stubs before it goes live.
      - name: Check the Worker routes correctly
        run: node tools/test_worker.mjs

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.110.0"

      # The hero video is 2.7 MB on every first visit. Serving it from R2 rather
      # than from raw.githubusercontent means it comes from storage built for
      # it, over our own domain, with Range requests answered — and it stops the
      # page depending on a third-party CDN that is unreliable from Iran.
      #
      # This runs after the deploy, and re-uploads on every run rather than
      # trying to detect a change: the objects are small, the workflow is rare,
      # and a skipped upload that should have happened is a broken video.
      # --remote is required, or Wrangler writes to a local simulation and
      # reports success without touching the bucket.
      - name: Publish media to R2
        run: |
          set -euo pipefail
          npx --yes wrangler@4.110.0 r2 object put vandidad-media/hero.mp4 \
            --file hero.mp4 --content-type video/mp4 --remote
          npx --yes wrangler@4.110.0 r2 object put vandidad-media/hero-poster.jpg \
            --file hero-poster.jpg --content-type image/jpeg --remote
          # The fonts ride the same path as the video. They are only present
          # after fetch-fonts.yml has run, and the Worker falls back to the
          # GitHub origin for an object that is not in the bucket, so a missing
          # file here is not a broken page — but it should not fail the deploy
          # of the Worker either.
          for f in vazirmatn-regular vazirmatn-bold; do
            if [ -f "fonts/$f.woff2" ]; then
              npx --yes wrangler@4.110.0 r2 object put "vandidad-media/fonts/$f.woff2" \
                --file "fonts/$f.woff2" --content-type font/woff2 --remote
            else
              echo "::warning::fonts/$f.woff2 not in the repo yet — run Fetch fonts"
            fi
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 48db27ab00625785134a70027e4efd0b
