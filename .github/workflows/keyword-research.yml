# Keyword research — runs the SERP lookups the writing depends on.
#
# WHY THIS IS A WORKFLOW AND NOT A SCRIPT SOMEONE RUNS
# ----------------------------------------------------
# Article topics were being chosen from what a search felt like it returned.
# That is guessing with extra steps. This fetches the actual Iranian Google
# result page for a list of queries and commits what it found, so topic
# selection argues from a file in the repository that anyone can open and
# check months later.
#
# It also exists because of a network fact: the environment the articles are
# written in cannot reach api.brightdata.com — the egress gateway answers 403
# to the CONNECT, so no credential fixes it. A GitHub runner has open
# internet, so the lookup happens here and the result travels back as a
# commit.
#
# WHAT IT NEEDS
# -------------
# Either the owner's gateway — GATE_KEY and GATE_URL — or, failing that,
# BRIGHTDATA_API_KEY. The gateway is preferred: it returns parsed results and
# enforces its own daily ceiling, so nothing here has to know about zones or
# quotas.
#
# GATE_URL is read from repository variables OR repository secrets. It is not
# a secret, so a variable is the right home for it — but the first run of this
# workflow found nothing because it had been entered on the other tab, and a
# workflow that only works if you picked the right tab is a workflow with a
# trap in it. Both are accepted; the diagnostic step below names which one it
# found, so a missing value is one glance rather than a guess.
#
# WHAT IT WRITES
# --------------
# research/serp-<date>.json  — the parsed results, one object per query
# research/latest.md         — the same thing readable, newest run wins
#
# Neither is served by the Worker; they are working notes for choosing what
# to write, not pages.

name: Keyword research

on:
  workflow_dispatch:
    inputs:
      queries:
        description: "Queries to look up, separated by a semicolon"
        required: false
        default: >-
          هوش مصنوعی برای کسب و کار ایرانی;
          چت بات فارسی برای فروش;
          پیگیری خودکار مشتری;
          دستیار هوش مصنوعی واتساپ فارسی;
          هوش مصنوعی برای کلینیک زیبایی
  schedule:
    # Sundays 06:00 UTC — before the week's writing starts.
    - cron: "0 6 * * 0"

permissions:
  contents: write

concurrency:
  group: keyword-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check a credential is present
        id: guard
        env:
          GATE_URL_VAR: ${{ vars.GATE_URL }}
          GATE_URL_SECRET: ${{ secrets.GATE_URL }}
          GATE_KEY: ${{ secrets.GATE_KEY }}
          GATE_KEY_VAR: ${{ vars.GATE_KEY }}
          BD_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
        run: |
          # Report what was found by NAME and LENGTH only. Never echo a value:
          # GitHub masks known secrets in logs, but a value pasted into the
          # wrong field is not a known secret and would print in the clear.
          GATE_URL="${GATE_URL_VAR:-$GATE_URL_SECRET}"
          KEY="${GATE_KEY:-$GATE_KEY_VAR}"
          echo "GATE_URL  — variable: ${#GATE_URL_VAR} chars, secret: ${#GATE_URL_SECRET} chars"
          echo "GATE_KEY  — secret: ${#GATE_KEY} chars, variable: ${#GATE_KEY_VAR} chars"
          echo "BRIGHTDATA_API_KEY — secret: ${#BD_KEY} chars"
          if [ -n "$KEY" ] && [ -n "$GATE_URL" ]; then
            echo "route: gateway"
            echo "gate_url=$GATE_URL" >> "$GITHUB_OUTPUT"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$BD_KEY" ]; then
            echo "route: bright data"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No research credential visible to this workflow."
            echo "Every count above is 0, so nothing reached the run. Check that"
            echo "they were added to THIS repository (vandidad-website) under"
            echo "Settings → Secrets and variables → Actions — the Repository"
            echo "tab, not Environment, not Dependabot, not Codespaces."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.ok == 'true'
        with:
          python-version: "3.12"

      - name: Look the queries up
        if: steps.guard.outputs.ok == 'true'
        env:
          GATE_URL: ${{ steps.guard.outputs.gate_url }}
          GATE_KEY: ${{ secrets.GATE_KEY || vars.GATE_KEY }}
          GATE_PROJECT: ${{ vars.GATE_PROJECT || 'vandidad-site' }}
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: ${{ vars.BRIGHTDATA_ZONE || 'cli_unlocker' }}
          QUERIES: ${{ github.event.inputs.queries }}
        run: python3 tools/keyword_research.py

      - name: Commit what it found
        if: steps.guard.outputs.ok == 'true'
        run: |
          if [ -z "$(git status --porcelain research)" ]; then
            echo "nothing changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research
          git commit -m "research: SERP snapshot $(date -u +%Y-%m-%d)"
          git push
